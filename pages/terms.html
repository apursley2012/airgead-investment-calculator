<!DOCTYPE html>
<!--

  | Purpose: Provides the browser-local saved-plan list and controls for       |
  |          reopening or deleting stored scenarios.                           |
  | Author: Alysha Pursley                                                     |

  +----------------------------------------------------------------------------+
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" />
		<meta
			name="referrer"
			content="strict-origin-when-cross-origin" />
		<meta
			content="width=device-width,initial-scale=1"
			name="viewport" />
		<meta
			content="Alysha Pursley"
			name="author" />
		<meta
			content="Review investment scenarios saved locally in this browser."
			name="description" />
		<title>Saved Plans | Airgead</title>
		<link
			href="../css/shared.css"
			rel="stylesheet" />
		<link
			href="../css/pages/saved-plans.css"
			rel="stylesheet" />
	</head>
	<body>
		<div
			class="site-shell"
			data-shell="">
			<main
				id="main-content"
				tabindex="-1"
				class="site-main">
				<div
					class="wrap page-head"
					data-page-header=""
					data-eyebrow="Local plan storage"
					data-title="Saved plans."
					data-description="Your saved plans stay in this browser. They are not linked to an account or shared across devices."></div>
				<section class="wrap section section-flush-top">
					<div
						class="saved-grid"
						id="plans"></div>
				</section>
			</main>
		</div>
		<script
			src="../js/components/shell.js"
			type="module"></script>
		<script
			src="../js/pages/saved-plans.js"
			type="module"></script>
	</body>
</html>
