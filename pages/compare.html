<!DOCTYPE html>
<!--
  +----------------------------------------------------------------------------+
  | Airgead Investment Calculator                                              |
  | Purpose: Provides side-by-side browser inputs and output for comparing two |
  |          investment scenarios.                                             |
  | Author: Alysha Pursley                                                     |
  | Copyright (c) 2026 Alysha Pursley.                                         |
  +----------------------------------------------------------------------------+
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" />
		<meta
			name="referrer"
			content="strict-origin-when-cross-origin" />
		<meta
			content="width=device-width,initial-scale=1"
			name="viewport" />
		<meta
			content="Alysha Pursley"
			name="author" />
		<meta
			content="Compare two investment scenarios using starting balance, monthly deposit, annual rate, and timeframe."
			name="description" />
		<title>Compare | Airgead</title>
		<link
			href="../css/shared.css"
			rel="stylesheet" />
		<link
			href="../css/pages/compare.css"
			rel="stylesheet" />
	</head>
	<body>
		<div
			class="site-shell"
			data-shell="">
			<main
				id="main-content"
				tabindex="-1"
				class="site-main">
				<div
					class="wrap page-head"
					data-page-header=""
					data-eyebrow="Scenario comparison"
					data-title="Compare two plans."
					data-description="Change the monthly deposits, annual rates, and timeframes to see how the final balances separate."></div>
				<section class="wrap section section-flush-top">
					<div class="grid-2">
						<form
							class="card scenario-card"
							data-scenario="a"
							aria-labelledby="scenario-a-title">
							<h2
								class="card-heading"
								id="scenario-a-title">
								Scenario A
							</h2>
							<div
								class="grid-2"
								data-investment-fields="a"></div>
						</form>
						<form
							class="card scenario-card"
							data-scenario="b"
							aria-labelledby="scenario-b-title">
							<h2
								class="card-heading"
								id="scenario-b-title">
								Scenario B
							</h2>
							<div
								class="grid-2"
								data-investment-fields="b"></div>
						</form>
					</div>
					<article class="card chart-card mt-24">
						<h2 class="card-heading">
							Compare projected final balances
						</h2>
						<p
							class="compare-error"
							id="compareError"
							role="status"
							aria-live="polite"
							hidden></p>
						<div class="compare-result">
							<div class="metric-tile">
								<span>Scenario A final</span>
								<strong id="finalA">$0</strong>
							</div>
							<div class="metric-tile">
								<span>Scenario B final</span>
								<strong id="finalB">$0</strong>
							</div>
						</div>
						<div class="chart-wrap">
							<p
								class="sr-only"
								id="comparisonSummary"
								role="status"
								aria-live="polite"
								aria-atomic="true"></p>
							<canvas
								id="comparisonChart"
								role="img"
								aria-label="Principal and interest for Scenario A and Scenario B"
								aria-describedby="comparisonSummary">
							</canvas>
						</div>
					</article>
				</section>
			</main>
		</div>
		<script
			src="../js/components/shell.js"
			type="module"></script>
		<script
			src="../js/pages/compare.js"
			type="module"></script>
	</body>
</html>
