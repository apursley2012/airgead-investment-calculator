<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare | Airgead</title><link rel="stylesheet" href="../css/styles.css"></head><body><div class="site-shell" data-shell><main class="site-main"><div class="wrap page-head"><div class="eyebrow">Scenario comparison</div><h1>Compare two plans.</h1><p class="lead">Change the monthly deposits, annual rates, and timeframes to see how the final balances separate.</p></div><section class="wrap section" style="padding-top:0"><div class="grid-2"><form class="card scenario-card" data-scenario="a"><h3>Scenario A</h3><div class="grid-2"><div class="field"><label>Starting balance</label><div class="input-wrap"><span class="prefix">$</span><input class="money" name="startingBalance" type="number" value="5000"></div></div><div class="field"><label>Monthly deposit</label><div class="input-wrap"><span class="prefix">$</span><input class="money" name="monthlyDeposit" type="number" value="250"></div></div><div class="field"><label>Annual rate</label><div class="input-wrap"><input class="percent" name="annualRate" type="number" value="5" step=".1"><span class="suffix">%</span></div></div><div class="field"><label>Years</label><input class="short" name="years" type="number" value="20"></div></div></form><form class="card scenario-card" data-scenario="b"><h3>Scenario B</h3><div class="grid-2"><div class="field"><label>Starting balance</label><div class="input-wrap"><span class="prefix">$</span><input class="money" name="startingBalance" type="number" value="5000"></div></div><div class="field"><label>Monthly deposit</label><div class="input-wrap"><span class="prefix">$</span><input class="money" name="monthlyDeposit" type="number" value="500"></div></div><div class="field"><label>Annual rate</label><div class="input-wrap"><input class="percent" name="annualRate" type="number" value="5" step=".1"><span class="suffix">%</span></div></div><div class="field"><label>Years</label><input class="short" name="years" type="number" value="20"></div></div></form></div><article class="card chart-card" style="margin-top:24px"><h3>Final balance comparison</h3><div class="compare-result"><div class="metric-tile"><span>Scenario A final</span><strong id="finalA">$0</strong></div><div class="metric-tile"><span>Scenario B final</span><strong id="finalB">$0</strong></div></div><div class="chart-wrap"><canvas id="comparisonChart"></canvas></div></article></section></main></div><script type="module" src="../js/components/shell.js"></script><script type="module" src="../js/pages/compare.js"></script></body></html>
