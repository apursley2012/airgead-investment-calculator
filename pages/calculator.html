<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator | Airgead</title><link rel="stylesheet" href="../css/styles.css"></head><body><div class="site-shell" data-shell><main class="site-main calculator-stage texture"><div class="wrap"><section class="big-number"><div class="label">With monthly deposits</div><div class="amount" id="displayWith">$0</div></section><form class="control-deck" id="calculatorForm"><div class="field"><label for="startingBalance">Starting balance</label><div class="input-wrap"><span class="prefix">$</span><input class="money" id="startingBalance" type="number" min="0" step="100" value="5000"></div></div><div class="field"><label for="monthlyDeposit">Monthly deposit</label><div class="input-wrap"><span class="prefix">$</span><input class="money" id="monthlyDeposit" type="number" min="0" step="25" value="250"></div></div><div class="field"><label for="annualRate">Annual rate</label><div class="input-wrap"><input class="percent" id="annualRate" type="number" min="0" step=".1" value="5"><span class="suffix">%</span></div></div><div class="field"><label for="years">Years</label><input class="short" id="years" type="number" min="1" max="80" step="1" value="20"></div><button class="btn btn-primary" type="submit">View Details</button></form><section class="quick-stats"><div class="quick-stat"><span>Without deposits</span><strong id="withoutDeposits">$0</strong></div><div class="quick-stat"><span>Difference</span><strong id="difference">$0</strong></div></section><div style="text-align:center"><div class="notice" id="noticeText">Monthly deposits change the final balance.</div></div></div></main></div><script type="module" src="../js/components/shell.js"></script><script type="module" src="../js/pages/calculator.js"></script></body></html>
