<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In | Airgead</title><link rel="stylesheet" href="../css/styles.css"></head><body><div class="site-shell" data-shell><main class="site-main texture"><section class="wrap"><article class="card login-card"><img src="../assets/logo/airgead-mark.png" alt="Airgead logo" style="width:112px;margin:0 auto 18px"><h2 style="text-align:center">Welcome to Airgead</h2><p style="text-align:center;color:var(--muted)">Use any email and password. This mock sign-in only stores a demo session locally.</p><form id="loginForm" style="display:grid;gap:16px;margin-top:22px"><div class="field"><label>Email address</label><input type="email" required placeholder="you@example.com" id="email" style="width:100%"></div><div class="field"><label>Password</label><input type="password" required placeholder="••••••••" style="width:100%"></div><div class="demo-note"><strong>Demo mode:</strong> No account is created and no data leaves the browser.</div><button class="btn btn-primary" type="submit">Sign In</button></form></article></section></main></div><script type="module" src="../js/components/shell.js"></script><script type="module" src="../js/pages/login.js"></script></body></html>
